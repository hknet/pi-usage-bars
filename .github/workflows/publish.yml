name: Publish to npm (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Verify the tarball is loadable
        run: npm run verify:tarball

      - name: Verify version is not already published
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view @hk_net/pi-usage-bars version 2>/dev/null || true)
          if [ "$PUBLISHED_VERSION" = "$PKG_VERSION" ]; then
            echo "@hk_net/pi-usage-bars@$PKG_VERSION is already published"
            exit 1
          fi

      - name: Publish package
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
